<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Ceiling wardrobe rail bracket arrangement</title>
  <desc id="desc">Front view showing a ceiling plate, reinforced main saddle, vertical oval rail, removable lower cap, and two clamp bolts.</desc>
  <defs>
    <style>
      .part { fill: #e7a63a; stroke: #503816; stroke-width: 3; }
      .cap { fill: #f2c161; stroke: #503816; stroke-width: 3; }
      .rail { fill: #c9ced3; stroke: #454b50; stroke-width: 3; }
      .fastener { fill: #69737d; stroke: #30363b; stroke-width: 2; }
      .guide { fill: none; stroke: #69737d; stroke-width: 2; stroke-dasharray: 7 6; }
      .label { font-family: sans-serif; font-size: 18px; fill: #25282a; }
      .small { font-family: sans-serif; font-size: 15px; fill: #4d5358; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#69737d"/>
    </marker>
  </defs>

  <rect x="80" y="40" width="340" height="48" rx="12" class="part"/>
  <circle cx="155" cy="64" r="10" class="fastener"/>
  <circle cx="345" cy="64" r="10" class="fastener"/>
  <path d="M130 88 L175 88 L198 136 L302 136 L325 88 L370 88 L322 192 L178 192 Z" class="part"/>
  <path d="M178 136 H322 V302 H178 Z" class="part"/>

  <rect x="218" y="119" width="64" height="218" rx="31" class="rail"/>
  <path d="M176 286 H324 V359 H176 Z" class="cap"/>
  <path d="M218 286 H282 V337 Q282 359 260 359 H240 Q218 359 218 337 Z" class="rail"/>

  <rect x="186" y="309" width="12" height="91" rx="6" class="fastener"/>
  <rect x="302" y="309" width="12" height="91" rx="6" class="fastener"/>
  <rect x="178" y="390" width="28" height="10" rx="3" class="fastener"/>
  <rect x="294" y="390" width="28" height="10" rx="3" class="fastener"/>

  <line x1="218" y1="374" x2="282" y2="374" class="guide" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="231" y="416" class="small">15 mm</text>
  <line x1="345" y1="119" x2="345" y2="337" class="guide" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="360" y="236" class="small">30 mm</text>

  <line x1="420" y1="65" x2="520" y2="65" class="guide"/>
  <text x="535" y="71" class="label">Ceiling plate</text>
  <line x1="324" y1="175" x2="520" y2="150" class="guide"/>
  <text x="535" y="156" class="label">Reinforced main body</text>
  <line x1="324" y1="321" x2="520" y2="265" class="guide"/>
  <text x="535" y="271" class="label">Removable cap</text>
  <line x1="314" y1="367" x2="520" y2="345" class="guide"/>
  <text x="535" y="351" class="label">2 × M4 bolts</text>
</svg>
